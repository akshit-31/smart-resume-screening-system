services:
  - type: web
    name: smart-resume-screener
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
